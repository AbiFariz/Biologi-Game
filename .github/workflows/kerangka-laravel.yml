# Sementara: membuat kerangka Laravel (dengan vendor) ke branch laravel-kerangka,
# karena lingkungan pengembang tidak bisa mengakses Packagist secara langsung.
name: Kerangka Laravel
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/kerangka-laravel.yml']
permissions:
  contents: write
jobs:
  buat:
    runs-on: ubuntu-latest
    steps:
      - name: Versi PHP server hosting
        run: |
          echo "::notice title=Header server::$(curl -sI --max-time 20 'https://detektifsains.speakverse.id/api/tutor.php?status=1' | grep -iE 'x-powered-by|server:' | tr -d '\r' | tr '\n' ' ')"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Buat proyek Laravel
        run: |
          composer create-project laravel/laravel:^12.0 app --no-interaction --prefer-dist
          cd app && echo "::notice title=Versi Laravel::$(php artisan --version)"
          composer config platform.php 8.2.0
          composer update --no-interaction --no-dev --prefer-dist -q || true
      - name: Kirim ke branch laravel-kerangka
        run: |
          cd app
          rm -f .env database/database.sqlite
          git init -q -b laravel-kerangka
          git config user.name "github-actions"; git config user.email "actions@github.com"
          sed -i '/^\/vendor$/d' .gitignore
          git add -A && git commit -q -m "Kerangka Laravel + vendor (dibuat otomatis)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" laravel-kerangka
