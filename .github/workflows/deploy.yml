# Deploy otomatis aplikasi Laravel ke cPanel (subdomain detektifsains.speakverse.id)
# Berjalan setiap ada push ke branch main, SETELAH kode masuk ke GitHub.
#
# Kredensial TIDAK disimpan di repo. Isi di GitHub:
#   Settings → Secrets and variables → Actions
#     FTP_SERVER      contoh: veleta.id.rapidplex.com
#     FTP_USERNAME    akun FTP
#     FTP_PASSWORD    kata sandi akun FTP
#     FTP_SERVER_DIR  folder aplikasi di server: /detektifsains.speakverse.id
#                     (boleh juga diisi .../public; akhiran /public dibuang otomatis)
#
# Di server, Document Root subdomain = <folder aplikasi>/public.
# Rahasia aplikasi ada di <folder aplikasi>/detektifsains-config.php (tidak diunggah);
# .env disusun otomatis darinya oleh bootstrap/siapkan-env.php.

name: Deploy ke cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAW_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USER: ${{ secrets.FTP_USERNAME }}
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      RAW_DIR: ${{ secrets.FTP_SERVER_DIR }}
      SITUS: https://detektifsains.speakverse.id
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Lewati bila secrets belum diisi
        if: env.RAW_SERVER == ''
        run: echo "::notice::Secrets FTP belum diisi — deploy ke cPanel dilewati."

      - name: Periksa alamat server dan folder tujuan
        if: env.RAW_SERVER != ''
        run: |
          host="$(printf '%s' "$RAW_SERVER" | tr -d '[:space:]')"
          host="${host#*://}"; host="${host%%/*}"; host="${host%%:*}"; host="${host#*@}"
          getent hosts "$host" >/dev/null || { echo "::error::Alamat FTP_SERVER tidak ditemukan (DNS)."; exit 1; }
          echo "FTP_HOST=$host" >> "$GITHUB_ENV"

          # PENGAMAN: hanya folder subdomain detektifsains, tidak pernah folder home/akar.
          dir="$(printf '%s' "$RAW_DIR" | tr -d '[:space:]')"
          dir="${dir%/}"; dir="${dir%/public}"; dir="${dir%/}"
          case "$dir" in
            ""|"/"|"."|"~"|*public_html*) echo "::error::FTP_SERVER_DIR harus folder subdomain, mis. /detektifsains.speakverse.id"; exit 1;;
          esac
          case "$dir" in *detektifsains*) ;; *) echo "::error::FTP_SERVER_DIR harus folder subdomain detektifsains."; exit 1;; esac
          echo "APP_DIR=$dir" >> "$GITHUB_ENV"

      - name: Siapkan PHP 8.4 + Composer
        if: env.RAW_SERVER != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Pasang dependensi (tanpa paket pengembangan)
        if: env.RAW_SERVER != ''
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Pasang lftp
        if: env.RAW_SERVER != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null

      - name: Unggah ke cPanel
        if: env.RAW_SERVER != ''
        run: |
          set -e
          lf () {
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "
              set net:timeout 30; set net:max-retries 3; set net:reconnect-interval-base 5;
              set ftp:passive-mode on; set ftp:ssl-allow true; set ftp:ssl-force true; set ssl:check-hostname no;
              $1; bye"
          }
          UMUM="--reverse --no-perms --parallel=8 --verbose=1"

          echo "1) Pustaka (vendor) — hanya berkas yang ukurannya berubah"
          lf "mirror $UMUM --ignore-time vendor $APP_DIR/vendor"

          echo "2) Aplikasi (folder public diunggah terakhir agar situs tidak sempat setengah jadi)"
          lf "mirror $UMUM \
            --exclude-glob .git* --exclude .git/ --exclude .github/ --exclude vendor/ --exclude public/ \
            --exclude tests/ --exclude docs/ --exclude node_modules/ \
            --exclude-glob .env --exclude-glob .env.* --exclude-glob detektifsains-config.php \
            --exclude detektifsains-logs/ --exclude-glob '*.log' \
            --exclude-glob .user.ini --exclude-glob php.ini \
            --exclude-glob README.md --exclude-glob phpunit.xml \
            ./ $APP_DIR"

          echo "3) Folder kerja Laravel"
          lf "cd $APP_DIR; mkdir -p -f storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache"

          echo "4) Folder public (aset + .htaccess Laravel)"
          lf "mirror $UMUM --exclude-glob .user.ini --exclude-glob php.ini public $APP_DIR/public"

          echo "5) Hapus berkas versi HTML lama (digantikan Laravel)"
          lf "cd $APP_DIR/public; rm -f index.html materi.html refleksi.html api/tutor.php; rmdir api" || true
          lf "cd $APP_DIR; rm -f index.html materi.html api/tutor.php; rmdir api; rm -r -f assets" || true

      - name: Verifikasi situs
        if: env.RAW_SERVER != ''
        run: |
          gagal=0
          for u in / /materi /refleksi /assets/data/aktivitas.json; do
            kode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITUS$u")
            echo "::notice title=$u::HTTP $kode"
            [ "$kode" = "200" ] || gagal=1
          done
          echo "::notice title=Status tutor & database::$(curl -s --max-time 30 -X POST -H 'Content-Type: application/json' -d '{"aksi":"status"}' "$SITUS/api/tutor")"
          [ $gagal = 0 ] || { echo "::error::Ada halaman yang tidak menjawab 200."; exit 1; }
