# Deploy otomatis ke cPanel (subdomain detektifsains.speakverse.id)
# Berjalan setiap ada push ke branch main, SETELAH kode masuk ke GitHub.
#
# Kredensial TIDAK disimpan di repo. Isi sendiri di GitHub:
#   Settings → Secrets and variables → Actions → New repository secret
#     FTP_SERVER      contoh: veleta.id.rapidplex.com (atau IP server dari cPanel)
#     FTP_USERNAME    akun FTP khusus yang dibatasi ke folder subdomain
#     FTP_PASSWORD    kata sandi akun FTP tersebut
#     FTP_SERVER_DIR  (opsional) folder tujuan di server. Kosongkan bila akun FTP
#                     sudah langsung mengarah ke folder subdomain.
# Selama secrets belum diisi, langkah deploy dilewati (workflow tetap hijau).

name: Deploy ke cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAW_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USER: ${{ secrets.FTP_USERNAME }}
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      RAW_DIR: ${{ secrets.FTP_SERVER_DIR }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Lewati bila secrets belum diisi
        if: env.RAW_SERVER == ''
        run: echo "::notice::Secrets FTP belum diisi — deploy ke cPanel dilewati."

      - name: Periksa alamat server FTP
        if: env.RAW_SERVER != ''
        run: |
          raw="$RAW_SERVER"
          echo "Pemeriksaan isi secret FTP_SERVER (isinya tetap disembunyikan):"
          case "$raw" in *"://"*) echo "  - mengandung awalan seperti https:// atau ftp://  → dibuang otomatis";; esac
          case "$raw" in *" "*|*$'\t'*|*$'\n'*|*$'\r'*) echo "  - mengandung spasi/baris baru → dibuang otomatis";; esac
          case "$raw" in *"/"*) echo "  - mengandung garis miring / → bagian setelahnya dibuang";; esac
          host="$(printf '%s' "$raw" | tr -d '[:space:]')"
          host="${host#*://}"; host="${host%%/*}"; host="${host%%:*}"; host="${host#*@}"
          if [ -z "$host" ]; then
            echo "::error::FTP_SERVER kosong setelah dibersihkan. Isi dengan alamat seperti veleta.id.rapidplex.com"; exit 1
          fi
          if ! getent hosts "$host" >/dev/null; then
            echo "::error::Alamat di FTP_SERVER tidak ditemukan di internet (DNS). Ganti isinya dengan veleta.id.rapidplex.com atau IP server dari cPanel (Shared IP Address)."
            exit 1
          fi
          echo "  ✓ alamat server ditemukan di DNS"
          echo "FTP_HOST=$host" >> "$GITHUB_ENV"

          # PENGAMAN: hanya boleh mengunggah ke folder subdomain, tidak pernah ke folder home/akar.
          dir="$(printf '%s' "$RAW_DIR" | tr -d '[:space:]')"
          dir="${dir%/}"
          case "$dir" in
            ""|"/"|"."|"./"|"~"|"/public_html"|"public_html")
              echo "::error::FTP_SERVER_DIR belum diisi atau menunjuk ke folder akar. Isi dengan folder subdomain, contoh: /detektifsains.speakverse.id"
              exit 1;;
          esac
          case "$dir" in
            *detektifsains*) ;;
            *) echo "::error::FTP_SERVER_DIR harus folder subdomain detektifsains (contoh: /detektifsains.speakverse.id). Deploy dihentikan demi keamanan."; exit 1;;
          esac
          echo "FTP_DIR=$dir/" >> "$GITHUB_ENV"

      - name: Pasang lftp
        if: env.RAW_SERVER != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null

      - name: Unggah ke cPanel
        if: env.RAW_SERVER != ''
        run: |
          set -e
          lf () {  # $1 = true untuk FTPS, false untuk FTP biasa; $2 = perintah
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "
              set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 5;
              set ftp:passive-mode on;
              set ftp:ssl-allow $1; set ftp:ssl-force $1; set ssl:check-hostname no;
              $2; bye"
          }
          MIRROR="mirror --reverse --no-perms --verbose=1 --parallel=4 \
            --exclude-glob .git --exclude-glob .gitignore --exclude .git/ --exclude .github/ \
            --exclude-glob README.md --exclude docs/ ./ $FTP_DIR"

          echo "Mencoba koneksi aman (FTPS)…"
          if lf true "$MIRROR"; then
            TLS=true; echo "✓ Terkirim lewat FTPS"
          else
            echo "::warning::FTPS gagal, mencoba FTP biasa…"
            lf false "$MIRROR"; TLS=false; echo "✓ Terkirim lewat FTP"
          fi

          # Izin mengikuti bawaan server (--no-perms): folder 755, file 644.

          # Laporan singkat: folder tujuan dan jumlah berkas (tanpa menampilkan isi folder lain)
          lf $TLS "cd $FTP_DIR; pwd" > laporan.txt 2>&1 || true
          echo "::notice title=Terkirim ke folder::$(tail -1 laporan.txt | sed 's#.*://[^/]*##')"
