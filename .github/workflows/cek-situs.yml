# Diagnosis sementara: memeriksa respons situs dari luar (tanpa kredensial).
name: Cek situs
on:
  push:
    paths: ['.github/workflows/cek-situs.yml']
  workflow_dispatch:
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - name: DNS dan respons HTTP
        run: |
          for h in detektifsains.speakverse.id math.speakverse.id veleta.id.rapidplex.com; do
            echo "::notice title=DNS $h::$(getent ahostsv4 $h | awk '{print $1}' | sort -u | tr '\n' ' ')"
          done
          for base in https://detektifsains.speakverse.id http://detektifsains.speakverse.id; do
            for u in / /index.html /materi.html /assets/css/style.css /api/tutor.php?status=1; do
              r=$(curl -sk -o /tmp/b -w '%{http_code} %{content_type}' --max-time 20 "$base$u")
              echo "::notice title=$base$u::$r $(grep -o '<title>[^<]*' /tmp/b | head -1)"
            done
          done
